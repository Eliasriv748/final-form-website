<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Form</title>
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/hero.css">
  <link rel="stylesheet" href="styles/collection.css">
  <link rel="stylesheet" href="styles/cart.css">
</head>
<body>

  <!-- ── HERO ── -->
  <section id="hero">
    <canvas id="scene-canvas"></canvas>

    <div id="logo-wrap">
      <div id="logo">FINAL FORM</div>
    </div>

    <div id="scroll-hint">↓ SCROLL ↓</div>
  </section>

  <!-- ── SIDEBAR ── -->
  <nav id="sidebar">
    <div id="sidebar-logo">FF</div>
    <a class="nav-link" href="index.html">HOME</a>
    <a class="nav-link" href="product.html">DROP 001</a>
    <a class="nav-link" href="product.html">THE RINGER</a>
    <button class="nav-link" id="cart-trigger" data-open-cart>INVENTORY <span id="cart-badge"></span></button>
  </nav>

  <!-- ── HILLS BLEED ── -->
  <div id="hills-bleed"></div>

  <!-- ── COLLECTION ── -->
  <section id="collection">
    <header style="padding: 60px 0 20px; position: relative; z-index: 2;">
      <p style="font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--mid);margin-bottom:6px;">DROP 001</p>
      <h2 style="font-size:clamp(20px,3vw,36px);letter-spacing:4px;text-transform:uppercase;color:var(--dark);font-weight:700;">THE FINAL FORM</h2>
    </header>

    <div id="products-row">

      <article class="product-card featured" data-id="ff-001" data-name="The Final Ringer" data-price="45" data-img="final-ringer-1.webp">
        <img src="final-ringer-1.webp" alt="The Final Ringer">
        <span class="product-name">The Final Ringer</span>
        <span class="product-price">$45</span>
      </article>

      <article class="product-card">
        <img src="final-ringer-2.webp" alt="Retro Logo Hoodie placeholder">
        <span class="product-name">Retro Logo Hoodie</span>
        <span class="product-price">Coming Soon</span>
      </article>

      <article class="product-card">
        <img src="final-ringer-3.webp" alt="Tactical Cargo Pants placeholder">
        <span class="product-name">Tactical Cargo Pants</span>
        <span class="product-price">Coming Soon</span>
      </article>

    </div>
  </section>

  <!-- ── FOOTER ── -->
  <footer id="footer">
    <span>FINAL FORM</span>
    <div class="footer-links">
      <a href="https://www.instagram.com/finalform.brand/" target="_blank" rel="noopener">Instagram</a>
      <a href="https://www.tiktok.com/@finalformbrand" target="_blank" rel="noopener">TikTok</a>
    </div>
    <span>© 2026 Final Form</span>
  </footer>

  <!-- ── INVENTORY MODAL ── -->
  <div id="cart-backdrop" hidden></div>
  <div id="cart-modal" hidden role="dialog" aria-modal="true" aria-label="Inventory">
    <div id="cart-header">
      <span id="cart-title">— INVENTORY —</span>
      <button id="cart-close" aria-label="Close inventory">✕</button>
    </div>
    <div id="cart-grid"></div>
    <div id="cart-footer">
      <div id="cart-subtotal">
        <span>SUBTOTAL</span>
        <span id="cart-subtotal-amount">$0.00</span>
      </div>
      <a href="#" id="cart-checkout">CHECKOUT</a>
    </div>
  </div>

  <script type="module" src="js/scene.js"></script>
  <script type="module" src="js/logo.js"></script>
  <script type="module" src="js/scroll.js"></script>
  <script type="module" src="js/cart.js"></script>
  <script type="module">
    import { addItem, openCart } from './js/cart.js';

    document.querySelectorAll('.product-card[data-id]').forEach(card => {
      card.addEventListener('click', () => {
        const { id, name, price, img } = card.dataset;
        addItem(id, name, 'OS', parseFloat(price), img);
        openCart();
      });
    });
  </script>

</body>
</html>
